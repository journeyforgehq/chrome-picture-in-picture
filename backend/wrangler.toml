name = "chrome-picture-in-picture-backend"
main = "src/index.ts"
compatibility_date = "2025-09-06"
compatibility_flags = ["nodejs_compat"]

[vars]
STATEMENT_DESCRIPTOR_SUFFIX = "PIP"
APP_SLUG = "picture-in-picture"
ENVIRONMENT = "production"
APP_VERSION = "0.0.0"

[[kv_namespaces]]
binding = "PAID"
id = "5f6b15e0382b4609960dd50726196ecb"

# Workers Logs — collect console logs + invocation metadata (Cloudflare dashboard
# → Workers & Pages → this worker → Logs). On by default for every generated backend.
[observability]
enabled = true
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = true
persist = true
head_sampling_rate = 1

# ── Named environments ───────────────────────────────────────────────
# `wrangler deploy --env staging|production` deploys a SEPARATE worker
# (name suffixed automatically → picture-in-picture-staging / -production).
# Named envs do NOT inherit top-level [vars]/[[kv_namespaces]] — re-declare here.
# Create separate KV namespaces per env (see DEPLOY.md) and paste ids below.

[env.staging]
vars = { ENVIRONMENT = "staging", APP_VERSION = "0.0.0", APP_SLUG = "picture-in-picture", STATEMENT_DESCRIPTOR_SUFFIX = "PIP" }
[[env.staging.kv_namespaces]]
binding = "PAID"
id = "5f6b15e0382b4609960dd50726196ecb"

[env.production]
vars = { ENVIRONMENT = "production", APP_VERSION = "0.0.0", APP_SLUG = "picture-in-picture", STATEMENT_DESCRIPTOR_SUFFIX = "PIP" }
[[env.production.kv_namespaces]]
binding = "PAID"
id = "REPLACE_WITH_PROD_KV_ID"
