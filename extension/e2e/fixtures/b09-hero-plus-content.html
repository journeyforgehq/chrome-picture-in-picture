<!doctype html><meta charset="utf-8"><title>B09 — hero loop plus real content</title><body>
<script type="module">
  import { makeVideo, ready } from "./lib/harness.js";
  // B08 with a real video added. The hero is bigger, first in the DOM, and
  // fully on-screen; it still must not win, because the >5s filter removes it
  // before scoring ever happens. This is the shape of a marketing site with an
  // embedded talk or demo further down the page.
  document.body.append(makeVideo({ label: "hero", width: 1600, height: 600, muted: true, duration: 3 }));
  document.body.append(makeVideo({ label: "content", width: 640, height: 360, muted: false, duration: 600 }));
  ready();
</script>
